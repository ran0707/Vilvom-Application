# TeaYOLO-N (tiny-object biased, P2 head)
# Train with: yolo detect train model=teayolo-n-p2.yaml data=tea.yaml imgsz=960 epochs=200 batch=16
# Depth/width scaled from yolov8n, adds P2 and lightweight RFB-lite.
nc: 18  # (6 pests × 3 severities) — keep as-is for now
scales: # (kept for clarity)
  depth_multiple: 0.33
  width_multiple: 0.25

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [64, 3, 1]]
  - [-1, 1, C2f,  [64, 1, True]]   # keep light
  - [-1, 1, Conv, [128, 3, 2]]     # 3-P2/4  (we will use this as high-res feature)
  - [-1, 2, C2f,  [128, 1, True]]
  - [-1, 1, Conv, [256, 3, 2]]     # 5-P3/8
  - [-1, 2, C2f,  [256, 1, True]]
  - [-1, 1, Conv, [512, 3, 2]]     # 7-P4/16
  - [-1, 2, C2f,  [512, 1, True]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 1, Conv, [512, 1, 1]]     # pre-neck norm

neck:
  # Reduce channels for neck (depthwise for edge)
  - [3, 1, Conv, [96, 1, 1]]       # slim P2 in
  - [6, 1, Conv, [128, 1, 1]]      # slim P3 in
  - [8, 1, Conv, [192, 1, 1]]      # slim P4 in
  - [9, 1, Conv, [256, 1, 1]]      # slim P5 in (from SPPF)

  # Top-down
  - [9, 1, Upsample, [None, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C2f, [192, 1, True]]

  - [-1, 1, Upsample, [None, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [128, 1, True]]

  - [-1, 1, Upsample, [None, 2]]
  - [[-1, 4], 1, Concat, [1]]
  # --- RFB-lite on P2 branch ---
  - [-1, 1, RFBlite, [96]]
  - [-1, 1, C2f, [96, 1, True]]

  # Bottom-up PAN
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, C2f, [128, 1, True]]

  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C2f, [192, 1, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C2f, [256, 1, True]]

head:
  - [[15, 18, 21, 24], 1, Detect, [nc]]   # P2, P3, P4, P5

